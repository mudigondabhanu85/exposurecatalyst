site_name: ExposureCatalyst Documentation
site_description: Vulnerability Intelligence & Advisory Platform
site_url: ""
use_directory_urls: true
docs_dir: docs
repo_name: exposurecatalyst
copyright: "ExposureCatalyst — INTERNAL. Generated by `python -m exposurecatalyst.docs build`."

theme:
  name: material
  logo: assets/brand/logo-light.svg          # synced from brand/ by the docs build
  favicon: assets/brand/mark-light.svg
  font: false                                 # brand fonts are self-hosted (docs/stylesheets/brand.css)
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.indexes, search.highlight, search.suggest, content.code.copy, toc.follow]
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}

extra_css:
  - stylesheets/brand.css

extra:
  version: !ENV [EXCAT_DOCS_VERSION, "dev"]
  build_date: !ENV [EXCAT_DOCS_DATE, "unreleased"]
  generator: false

exclude_docs: |
  /diagrams/
  /assets/fonts/README.md
  /help/tooltips.yml

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Installation & deployment: getting-started/installation.md
  - User guide:
      - CVE Intelligence: user-guide/cve-intelligence.md
      - Advisories (analysts & approvers): user-guide/advisories.md
  - Admin guide:
      - Users & RBAC: admin-guide/rbac.md
      - CVE ingestion sources: admin-guide/ingestion-sources.md
      - SMTP & email delivery: admin-guide/smtp.md
  - Architecture:
      - High-level AWS architecture: architecture/high-level.md
      - Diagram standards & pipeline: architecture/diagram-standards.md
      - Data model: architecture/data-model.md
      - Decision records:
          - architecture/adr/index.md
          - ADR-0001 Sync SQLAlchemy & portable schema: architecture/adr/0001-sync-sqlalchemy-portable-schema.md
          - ADR-0002 Server-side sessions & CSRF: architecture/adr/0002-server-side-sessions.md
          - ADR-0003 DB-coordinated scheduler tick: architecture/adr/0003-db-coordinated-scheduler.md
          - ADR-0004 Single-source help & docs: architecture/adr/0004-single-source-help.md
          - ADR-0005 Content Security Policy scoping: architecture/adr/0005-csp-scoping.md
  - Security:
      - Security overview: security/overview.md
  - Reference:
      - Configuration: reference/configuration.md
      - Roles × permissions: reference/rbac-matrix.md
      - API: reference/api.md
  - Operations:
      - Runbooks: operations/runbooks.md
  - In-app help:
      - help/help-center.md
      - help/cve-intelligence.md
      - help/cve-detail.md
      - help/advisories.md
      - help/advisory-editor.md
      - help/advisory-templates.md
      - help/settings-smtp.md
      - help/news.md
      - help/settings-sources.md
      - help/settings-rbac.md
      - help/glossary.md
      - help/faq.md
      - help/shortcuts.md
  - Brand: brand.md
  - Changelog: changelog.md
