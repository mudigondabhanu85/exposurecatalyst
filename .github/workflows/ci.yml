name: ci
on:
  push: {branches: [main]}
  pull_request:
  release: {types: [published]}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env: {POSTGRES_DB: excat, POSTGRES_USER: excat, POSTGRES_PASSWORD: ci-only-password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U excat" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests migrations
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit --skip-editable
      - run: pytest --cov=exposurecatalyst --cov-report=xml
      - name: Migrations apply cleanly on PostgreSQL (incl. audit trigger) and downgrade
        env:
          EXCAT_ENV: test
          EXCAT_DATABASE_URL: postgresql+psycopg://excat:ci-only-password@localhost:5432/excat
        run: |
          exposurecatalyst migrate
          python -c "import psycopg; c=psycopg.connect('postgresql://excat:ci-only-password@localhost/excat'); c.execute(\"INSERT INTO audit_log(occurred_at,action,outcome,details,prev_hash,hash) VALUES (now(),'t','success','{}','0','1')\"); c.commit()
          try:
              c.execute('DELETE FROM audit_log'); raise SystemExit('trigger missing')
          except psycopg.errors.RaiseException: print('audit trigger OK')"
          alembic downgrade base

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Brand assets shipped unmodified
        run: |
          for f in svg/logo-dark-wordmark.svg svg/logo-light.svg svg/mark-light.svg favicon/favicon.svg png/og-image-1200x630.png; do
            cmp "brand/assets/$f" "frontend/dist/brand/$f"
          done

  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only used on release events, to attach the guides to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[docs]"
      - name: Diagrams + Mermaid (Docker) + reference pages + strict MkDocs + DOCX/HTML exports (Pandoc in Docker)
        env:
          EXCAT_DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python -m exposurecatalyst.docs build --docker
      - name: Generated files are committed (no drift; every Mermaid block has a committed render)
        run: |
          git diff --exit-code -- docs/reference
          test -z "$(git status --porcelain -- docs/assets/mermaid)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: docs-site, path: dist/docs/site}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: docs-exports, path: "dist/docs/exports/*.*"}
      - name: Attach the Word / HTML guides and the docs site to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd dist/docs && zip -qr "../../exposurecatalyst-${TAG#v}-docs-site.zip" site)
          gh release upload "$TAG" dist/docs/exports/*.docx dist/docs/exports/*.html \
            "exposurecatalyst-${TAG#v}-docs-site.zip" --clobber

  terraform:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with: {terraform_version: 1.9.8}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate
      - name: IaC scan (fails on HIGH/CRITICAL) — pinned Trivy image, same as `make scan`
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.1 config --quiet \
            --severity HIGH,CRITICAL --exit-code 1 /src

  image:
    needs: [backend, frontend, docs, terraform]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t exposurecatalyst:${{ github.sha }} .
      - run: docker build --target proxy -t exposurecatalyst-proxy:${{ github.sha }} .
      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          for img in exposurecatalyst exposurecatalyst-proxy; do   # scans a saved tarball: no Docker socket mount
            docker save -o "$RUNNER_TEMP/scan/$img.tar" "$img:${{ github.sha }}"
            docker run --rm -v "$RUNNER_TEMP/scan:/scan:ro" -v "$PWD/docker/trivy-secret.yaml:/cfg/secret.yaml:ro" \
              aquasec/trivy:0.57.1 image --quiet --input "/scan/$img.tar" --secret-config /cfg/secret.yaml \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          done

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: docker compose up → wait for health → HTTPS checks via the proxy → tear down
        run: ./docker/smoke.sh
