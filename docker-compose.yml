# ExposureCatalyst — one-command deployment:  docker compose up -d   →   https://<EXCAT_FQDN>  (default https://localhost)
#
# Requires Docker Compose v2.24+. Every setting has a safe default, so no .env is needed for a first run; secrets are
# generated by the one-shot `init` service into the `secrets` / `db-secret` volumes and never overwritten. Values you
# set explicitly in .env (EXCAT_ENCRYPTION_KEY, POSTGRES_PASSWORD, …) always take precedence and are kept.
#
# Start order: init → postgres → migrate → api → scheduler → proxy  (healthchecks + depends_on conditions)
# Networks:    edge (proxy ↔ api, the only published ports) · backend (internal: postgres, redis) · egress (outbound)
# Profiles:    direct (http://127.0.0.1:8000 like before) · scale (worker + redis) · backup (scheduled pg_dump)
#              ollama (local AI) · devmail (Mailpit)
# External DB: COMPOSE_FILE=docker-compose.yml:docker/compose.external-db.yml (see docs: Migrating into Docker)
name: exposurecatalyst

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging

x-app: &app
  <<: *hardening
  image: exposurecatalyst:${EXCAT_IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  environment: &app-env
    EXCAT_DATABASE_URL: ${EXCAT_DATABASE_URL:-postgresql+psycopg://excat@postgres:5432/excat}
    # Used only when the value itself is not set (explicit EXCAT_* values always win):
    EXCAT_DATABASE_PASSWORD_FILE: ${EXCAT_DATABASE_PASSWORD_FILE-/var/lib/excat/db-secret/db_password}
    EXCAT_ENCRYPTION_KEY_FILE: /var/lib/excat/secrets/encryption_key
    EXCAT_PUBLIC_URL: ${EXCAT_PUBLIC_URL:-https://localhost}
    EXCAT_FQDN: ${EXCAT_FQDN-localhost}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,api,proxy,ollama}
  restart: unless-stopped

x-app-volumes: &app-volumes
  - secrets:/var/lib/excat/secrets:ro
  - db-secret:/var/lib/excat/db-secret:ro
  - certs:/var/lib/excat/certs
  - uploads:/var/lib/excat/uploads
  - exports:/var/lib/excat/exports

services:
  # ---- one-shot bootstrap: secrets + self-signed certificate (never overwrites) ---------------------------------
  init:
    <<: *app
    build: {context: ., target: runtime, args: {EXCAT_VERSION: "${EXCAT_VERSION:-1.3.0}", DOCKERHUB: "${EXCAT_DOCKERHUB_MIRROR:-docker.io}"}}
    command: ["exposurecatalyst", "bootstrap"]
    restart: "no"
    group_add: ["70"]           # may set group 70 (postgres) on the db-secret files only
    volumes:
      - secrets:/var/lib/excat/secrets
      - db-secret:/var/lib/excat/db-secret
      - certs:/var/lib/excat/certs
      - backups:/var/lib/excat/backups
    network_mode: none
    healthcheck: {disable: true}
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}

  postgres:
    image: ${EXCAT_DOCKERHUB_MIRROR:-docker.io}/library/postgres:16.16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_DB: excat
      POSTGRES_USER: excat
      POSTGRES_PASSWORD_FILE: /run/db-secret/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - db-secret:/run/db-secret:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excat -d excat"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      init: {condition: service_completed_successfully}
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    logging: *logging
    deploy: {resources: {limits: {cpus: "2", memory: 2g}}}
    restart: unless-stopped

  # ---- one-shot migrations; api/scheduler start only after success ------------------------------------------------
  migrate:
    <<: *app
    command: ["exposurecatalyst", "migrate"]
    restart: "no"
    volumes: *app-volumes
    networks: [backend]
    healthcheck: {disable: true}
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy, required: false}
    deploy: {resources: {limits: {cpus: "1", memory: 512m}}}

  api:
    <<: *app
    build: {context: ., target: runtime, args: {EXCAT_VERSION: "${EXCAT_VERSION:-1.3.0}", DOCKERHUB: "${EXCAT_DOCKERHUB_MIRROR:-docker.io}"}}
    command: ["exposurecatalyst", "serve", "--host", "0.0.0.0", "--port", "8000",
              "--forwarded-allow-ips", "${EXCAT_EDGE_SUBNET:-172.30.250.0/24}",
              "--workers", "${EXCAT_WEB_CONCURRENCY:-1}"]
    volumes:
      - secrets:/var/lib/excat/secrets:ro
      - db-secret:/var/lib/excat/db-secret:ro
      - certs:/var/lib/excat/certs
      - uploads:/var/lib/excat/uploads
      - exports:/var/lib/excat/exports
      - caddy-admin:/run/caddy-admin
    networks: [edge, backend, egress]
    healthcheck:
      test: ["CMD", "exposurecatalyst", "healthcheck", "api"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy: {resources: {limits: {cpus: "2", memory: 1g}}}

  scheduler:
    <<: *app
    command: ["exposurecatalyst", "scheduler"]
    environment:
      <<: *app-env
      EXCAT_SCHEDULER_HEARTBEAT: /tmp/excat-scheduler.heartbeat
    volumes: *app-volumes
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "exposurecatalyst", "healthcheck", "scheduler", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    deploy: {resources: {limits: {cpus: "1", memory: 768m}}}

  # ---- reverse proxy: the ONLY service with published ports ---------------------------------------------------------
  proxy:
    <<: *hardening
    build: {context: ., target: proxy, args: {EXCAT_VERSION: "${EXCAT_VERSION:-1.3.0}", DOCKERHUB: "${EXCAT_DOCKERHUB_MIRROR:-docker.io}"}}
    image: exposurecatalyst-proxy:${EXCAT_IMAGE_TAG:-local}
    ports:
      - "${EXCAT_BIND_ADDRESS:-0.0.0.0}:${EXCAT_HTTP_PORT:-80}:8080"
      - "${EXCAT_BIND_ADDRESS:-0.0.0.0}:${EXCAT_HTTPS_PORT:-443}:8443"
    environment:
      EXCAT_HTTPS_PORT_SUFFIX: ${EXCAT_HTTPS_PORT_SUFFIX:-}
      EXCAT_TRUSTED_PROXIES: ${EXCAT_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/run/caddy-admin
    networks:
      edge: {ipv4_address: "${EXCAT_PROXY_IP:-172.30.250.10}"}
    depends_on:
      init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    deploy: {resources: {limits: {cpus: "1", memory: 256m}}}
    restart: unless-stopped

  # ---- optional profiles ----------------------------------------------------------------------------------------
  direct:   # `--profile direct`: the pre-1.4 plain-HTTP endpoint on 127.0.0.1:8000 (set EXCAT_PUBLIC_URL to match)
    <<: *hardening
    image: exposurecatalyst-proxy:${EXCAT_IMAGE_TAG:-local}
    profiles: [direct]
    command: ["caddy", "reverse-proxy", "--from", ":8000", "--to", "api:8000"]
    ports: ["127.0.0.1:${EXCAT_DIRECT_PORT:-8000}:8000"]
    volumes: [caddy-data:/data, caddy-config:/config]
    networks: [edge]
    healthcheck: {disable: true}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  worker:   # `--profile scale`: extra job runners; the database claim makes them duplicate-safe
    <<: *app
    profiles: [scale]
    command: ["exposurecatalyst", "scheduler"]
    environment:
      <<: *app-env
      EXCAT_SCHEDULER_HEARTBEAT: /tmp/excat-scheduler.heartbeat
    volumes: *app-volumes
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "exposurecatalyst", "healthcheck", "scheduler", "--max-age", "180"]
      interval: 30s
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      replicas: ${EXCAT_WORKER_REPLICAS:-1}
      resources: {limits: {cpus: "1", memory: 768m}}

  redis:    # `--profile scale`: provisioned for queue/cache use; the current release does not require it
    <<: *hardening
    image: ${EXCAT_DOCKERHUB_MIRROR:-docker.io}/library/redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    profiles: [scale]
    user: "999:70"
    command: ["redis-server", "/run/db-secret/redis.conf"]
    volumes: [redis:/data, db-secret:/run/db-secret:ro]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass \"\\(.*\\)\"$$/\\1/p' /run/db-secret/redis.conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      init: {condition: service_completed_successfully}
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}
    restart: unless-stopped

  backup:   # `--profile backup`: pg_dump every EXCAT_BACKUP_INTERVAL_HOURS into the backups volume
    image: ${EXCAT_DOCKERHUB_MIRROR:-docker.io}/library/postgres:16.16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    profiles: [backup]
    user: "70:70"
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    environment:
      EXCAT_BACKUP_INTERVAL_HOURS: ${EXCAT_BACKUP_INTERVAL_HOURS:-24}
      EXCAT_BACKUP_RETENTION_DAYS: ${EXCAT_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/opt/backup/backup.sh:ro
      - db-secret:/run/db-secret:ro
      - backups:/backups
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}
    restart: unless-stopped

  ollama:   # `--profile ollama`: local LLM at http://ollama:11434 (AI Providers; needs EXCAT_AI_ALLOW_PRIVATE_ENDPOINTS=true)
    image: ${EXCAT_DOCKERHUB_MIRROR:-docker.io}/ollama/ollama:0.5.4@sha256:18bfb1d605604fd53dcad20d0556df4c781e560ebebcd923454d627c994a0e37
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    networks: [backend, egress]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    deploy: {resources: {limits: {memory: 8g}}}
    restart: unless-stopped

  mailpit:  # `--profile devmail`: dev mail catcher → UI on http://localhost:8025
    image: ${EXCAT_DOCKERHUB_MIRROR:-docker.io}/axllent/mailpit:v1.21.5@sha256:67143952f5f123692b922bced8ab2cea8947292576011a6b22d2cb2649dbcf78
    profiles: [devmail]
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend, edge]
    logging: *logging
    restart: unless-stopped

networks:
  edge:
    ipam:
      config: [{subnet: "${EXCAT_EDGE_SUBNET:-172.30.250.0/24}"}]
  backend:
    internal: true
  egress: {}

volumes:
  pgdata:
  redis:
  secrets:
  db-secret:
  certs:
  uploads:
  exports:
  backups:
  caddy-data:
  caddy-config:
  caddy-admin:
  ollama:
