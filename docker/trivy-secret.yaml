# Trivy secret-scanner allow rules for `make scan` / CI. Keep this list minimal and specific.
allow-rules:
  - id: python3-saml-pem-markers
    description: python3-saml strips "-----BEGIN PRIVATE KEY-----" markers from user input (string literals, not a key)
    path: .*/site-packages/onelogin/saml2/(utils\.py|__pycache__/utils\..*\.pyc)
